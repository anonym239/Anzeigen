name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flohmarkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: flohmarkt-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: flohmarkt-debug-apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Flohmarkt Finder v${{ github.run_number }}"
          body: |
            ## 🛍️ Flohmarkt Finder APK
            
            Automatisch gebaut aus Commit: ${{ github.sha }}
            
            ### 📱 Installation
            1. **APK herunterladen** (unten bei "Assets")
            2. APK auf das Android-Gerät übertragen (z.B. per USB oder E-Mail)
            3. Auf dem Gerät: Einstellungen → Sicherheit → "Installation aus unbekannten Quellen" erlauben
            4. APK antippen und installieren
            
            ### ✨ Features
            - Flohmärkte, Haushaltsauflösungen & Trödelmärkte suchen
            - Ortsbasierte Suche mit Kategorie- und Datumsfilter
            - Favoriten lokal speichern
            - Originalanzeigen im Browser öffnen
            - Material You Design (Android 12+)
          files: ./apk/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
